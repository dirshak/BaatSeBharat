[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage is deliberately NOT in addopts. When --cov lived here, a plain
# `pytest` invocation aborted with "unrecognized arguments" on any machine
# where pytest-cov happened to be missing -- the whole suite became
# unrunnable because of an optional reporting plugin. Run coverage
# explicitly instead:
#     pytest --cov=src --cov-report=html --cov-report=term-missing
addopts =
    -v

markers =
    network: test performs live network I/O (deselect with '-m "not network"')
